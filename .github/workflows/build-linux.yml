name: 5. Linux
#
# ============================================================================
# SCOPE, STATED PLAINLY: this workflow does NOT rebuild the installer .exe
# files from source - see build-mac.yml's header comment for the full
# reasoning (same applies here). It expects TWO already-built, already-signed
# self-contained installer FOLDERS to exist in the repo's dist/ folder:
#
#   dist/Nutricula-32bit-SC/  (from "2. Windows - 32bit (for Mac/Linux)": the
#                              workflow's zip, extracted, with ONLY its
#                              NutriculaExpertInstaller.dll protected by .NET
#                              Reactor, then both the apphost exe and its
#                              three companions (.dll/.deps.json/
#                              .runtimeconfig.json) signed AND renamed
#                              TOGETHER by NutriculaSignInstaller to
#                              Nutricula-32bit-SC.{exe,dll,deps.json,
#                              runtimeconfig.json} - every other file
#                              untouched)
#   dist/Nutricula-64bit-SC/  (same, from "3. Windows - 64bit (for Mac/Linux)",
#                              renamed to Nutricula-64bit-SC.*)
#
# ("SC" = self-contained: these two carry their own .NET runtime. The plain
# dist/Nutricula-32bit.exe is the Windows installer - it is NOT used here.)
# Each folder is the WHOLE self-contained publish output (the apphost exe,
# its managed .dll, and dozens of .NET runtime files) - not a single file.
# Neither ConfuserEx nor .NET Reactor can merge those native runtime files
# into one exe, so the folder ships as-is; see README-GITHUB-BUILD.md.
#
# and only wraps them for Linux double-click (AppImage) launch. BOTH are
# bundled (each folder's contents copied whole into its own per-architecture
# subfolder: Resources/win-x86/ and Resources/win-x64/, the paths AppRun
# expects): AppRun tries the 64-bit one first and, only if the Wine it found
# cannot start that, the 32-bit one - invisibly to the person double-clicking
# (see linux-appdir/AppRun).
#
# The output is a single file, "Nutricula.AppImage".
#
# This workflow is independent of the Windows workflows and of
# "4. Mac" - each has its own "Run workflow" button on the Actions tab, so
# you can build just this one platform whenever you want, without touching
# the others. A tag push (v*) triggers the Mac and Linux builds, each
# attaching its own file to the same GitHub Release separately.
# ============================================================================

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Verify both pre-built self-contained installer folders are present
        run: |
          for pair in "32:dist/Nutricula-32bit-SC" "64:dist/Nutricula-64bit-SC"; do
            bits="${pair%%:*}"
            d="${pair#*:}"
            if [ ! -d "$d" ]; then
              echo "::error::'$d' is missing (or is not a folder). Build both self-contained installers (workflows '2. Windows - 32bit (for Mac/Linux)' and '3. Windows - 64bit (for Mac/Linux)'), extract each zip, protect ONLY NutriculaExpertInstaller.dll with .NET Reactor, then run NutriculaSignInstaller on the folder (it signs AND renames the apphost exe plus its 3 companions together), then place each WHOLE FOLDER in dist/ under exactly these names."
              exit 1
            fi
            for ext in exe dll; do
              if [ ! -f "$d/Nutricula-${bits}bit-SC.$ext" ]; then
                echo "::error::'$d/Nutricula-${bits}bit-SC.$ext' is missing - '$d' does not look like a complete, already-signed self-contained publish folder (NutriculaSignInstaller renames NutriculaExpertInstaller.* to Nutricula-${bits}bit-SC.* when it signs it - run that first)."
                exit 1
              fi
            done
          done

      - name: Verify each installer folder really has the architecture its name says
        run: |
          # Guards against the two folders being swapped or mis-named when they
          # were placed into dist/ by hand: reads the PE header's Machine
          # field of the apphost exe inside each folder. 32bit must be x86
          # (0x014C), 64bit must be x64 (0x8664).
          python3 - <<'PY'
          import struct, sys
          expected = {
              "dist/Nutricula-32bit-SC/Nutricula-32bit-SC.exe": (0x014C, "32-bit (x86)"),
              "dist/Nutricula-64bit-SC/Nutricula-64bit-SC.exe": (0x8664, "64-bit (x64)"),
          }
          bad = False
          for path, (want, label) in expected.items():
              with open(path, "rb") as fh:
                  head = fh.read(4096)
              if head[:2] != b"MZ":
                  print("::error::%s is not a Windows executable." % path); bad = True; continue
              pe = struct.unpack_from("<I", head, 0x3C)[0]
              if pe + 6 > len(head) or head[pe:pe+4] != b"PE\0\0":
                  print("::error::%s has no valid PE header." % path); bad = True; continue
              machine = struct.unpack_from("<H", head, pe + 4)[0]
              if machine != want:
                  print("::error::%s should be %s (Machine 0x%04X) but is 0x%04X - wrong folder or wrong name." % (path, label, want, machine)); bad = True
              else:
                  print("OK: %s is %s." % (path, label))
          sys.exit(1 if bad else 0)
          PY

      - name: Assemble the AppDir
        run: |
          set -e
          APPDIR="build/Nutricula.AppDir"
          mkdir -p "$APPDIR/Resources/win-x86" "$APPDIR/Resources/win-x64"
          cp linux-appdir/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp linux-appdir/NutriculaInstaller.desktop "$APPDIR/NutriculaInstaller.desktop"
          # Each self-contained folder's contents, copied WHOLE (the signed,
          # renamed Nutricula-{32,64}bit-SC.exe/.dll/.deps.json/
          # .runtimeconfig.json, plus every untouched .NET runtime file) into
          # the per-architecture subfolder AppRun looks for.
          cp -R "dist/Nutricula-32bit-SC/." "$APPDIR/Resources/win-x86/"
          cp -R "dist/Nutricula-64bit-SC/." "$APPDIR/Resources/win-x64/"
          # appimagetool requires SOME icon file to exist. linux-appdir/NutriculaInstaller.png
          # is a tiny 1x1 placeholder checked into the repo - replace that
          # file with a real icon (same name, same location) whenever you
          # have one; nothing here needs to change.
          cp linux-appdir/NutriculaInstaller.png "$APPDIR/NutriculaInstaller.png"

      - name: Download appimagetool
        run: |
          set -e
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build the AppImage
        env:
          # appimagetool normally detects the target architecture by
          # inspecting a real ELF binary inside the AppDir. Our AppDir has
          # no such binary - AppRun is a shell script, and the actual
          # payload (Resources/Nutricula-*.exe) is a Windows PE file,
          # not ELF - so detection fails ("Unable to guess the
          # architecture"). This AppImage only runs on x86_64 Linux hosts
          # anyway (Nutricula's MT4/MT5 + Wine stack targets x86_64), so
          # the architecture is simply stated explicitly here instead.
          ARCH: x86_64
        run: |
          set -e
          ./appimagetool --appimage-extract-and-run "build/Nutricula.AppDir" "build/Nutricula.AppImage"
          chmod +x "build/Nutricula.AppImage"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nutricula
          path: build/Nutricula.AppImage

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/Nutricula.AppImage
