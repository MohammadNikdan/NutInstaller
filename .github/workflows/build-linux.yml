name: 5. Linux
#
# ============================================================================
# SCOPE, STATED PLAINLY: this workflow does NOT rebuild the installer .exe
# files from source - see build-mac.yml's header comment for the full
# reasoning (same applies here). It expects TWO already-built, already-signed
# installer files to exist in the repo's dist/ folder:
#
#   dist/Nutricula-32bit-SC.exe  (from "2. Windows - 32bit (for Mac/Linux)",
#                                 then NutriculaSignInstaller)
#   dist/Nutricula-64bit-SC.exe  (from "3. Windows - 64bit (for Mac/Linux)",
#                                 then NutriculaSignInstaller)
#
# ("SC" = self-contained: these two carry their own .NET runtime. The plain
# dist/Nutricula-32bit.exe is the Windows installer - it is NOT used here.)
#
# and only wraps them for Linux double-click (AppImage) launch. BOTH are
# bundled (stored inside it as Resources/Nutricula-32bit.exe and
# Resources/Nutricula-64bit.exe, the names AppRun expects): AppRun tries the
# 64-bit one first and, only if the Wine it found cannot start that, the
# 32-bit one - invisibly to the person double-clicking (see
# linux-appdir/AppRun).
#
# The output is a single file, "Nutricula.AppImage".
#
# This workflow is independent of the Windows workflows and of
# "4. Mac" - each has its own "Run workflow" button on the Actions tab, so
# you can build just this one platform whenever you want, without touching
# the others. A tag push (v*) triggers the Mac and Linux builds, each
# attaching its own file to the same GitHub Release separately.
# ============================================================================

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Verify both pre-built self-contained installers are present
        run: |
          for f in "dist/Nutricula-32bit-SC.exe" "dist/Nutricula-64bit-SC.exe"; do
            if [ ! -f "$f" ]; then
              echo "::error::'$f' is missing. Build both self-contained installers (workflows '2. Windows - 32bit (for Mac/Linux)' and '3. Windows - 64bit (for Mac/Linux)', then NutriculaSignInstaller), and place both signed files in dist/ under exactly these names."
              exit 1
            fi
          done

      - name: Verify each installer really has the architecture its name says
        run: |
          # Guards against the two files being swapped or mis-named when they
          # were placed into dist/ by hand: reads the PE header's Machine
          # field of each file. 32bit must be x86 (0x014C), 64bit must be
          # x64 (0x8664).
          python3 - <<'PY'
          import struct, sys
          expected = {
              "dist/Nutricula-32bit-SC.exe": (0x014C, "32-bit (x86)"),
              "dist/Nutricula-64bit-SC.exe": (0x8664, "64-bit (x64)"),
          }
          bad = False
          for path, (want, label) in expected.items():
              with open(path, "rb") as fh:
                  head = fh.read(4096)
              if head[:2] != b"MZ":
                  print("::error::%s is not a Windows executable." % path); bad = True; continue
              pe = struct.unpack_from("<I", head, 0x3C)[0]
              if pe + 6 > len(head) or head[pe:pe+4] != b"PE\0\0":
                  print("::error::%s has no valid PE header." % path); bad = True; continue
              machine = struct.unpack_from("<H", head, pe + 4)[0]
              if machine != want:
                  print("::error::%s should be %s (Machine 0x%04X) but is 0x%04X - wrong file or wrong name." % (path, label, want, machine)); bad = True
              else:
                  print("OK: %s is %s." % (path, label))
          sys.exit(1 if bad else 0)
          PY

      - name: Assemble the AppDir
        run: |
          set -e
          APPDIR="build/Nutricula.AppDir"
          mkdir -p "$APPDIR/Resources"
          cp linux-appdir/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp linux-appdir/NutriculaInstaller.desktop "$APPDIR/NutriculaInstaller.desktop"
          # Stored under the names AppRun looks for.
          cp "dist/Nutricula-32bit-SC.exe" "$APPDIR/Resources/Nutricula-32bit.exe"
          cp "dist/Nutricula-64bit-SC.exe" "$APPDIR/Resources/Nutricula-64bit.exe"
          # appimagetool requires SOME icon file to exist. linux-appdir/NutriculaInstaller.png
          # is a tiny 1x1 placeholder checked into the repo - replace that
          # file with a real icon (same name, same location) whenever you
          # have one; nothing here needs to change.
          cp linux-appdir/NutriculaInstaller.png "$APPDIR/NutriculaInstaller.png"

      - name: Download appimagetool
        run: |
          set -e
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build the AppImage
        env:
          # appimagetool normally detects the target architecture by
          # inspecting a real ELF binary inside the AppDir. Our AppDir has
          # no such binary - AppRun is a shell script, and the actual
          # payload (Resources/Nutricula-*.exe) is a Windows PE file,
          # not ELF - so detection fails ("Unable to guess the
          # architecture"). This AppImage only runs on x86_64 Linux hosts
          # anyway (Nutricula's MT4/MT5 + Wine stack targets x86_64), so
          # the architecture is simply stated explicitly here instead.
          ARCH: x86_64
        run: |
          set -e
          ./appimagetool --appimage-extract-and-run "build/Nutricula.AppDir" "build/Nutricula.AppImage"
          chmod +x "build/Nutricula.AppImage"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nutricula
          path: build/Nutricula.AppImage

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/Nutricula.AppImage
