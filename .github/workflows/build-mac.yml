name: 4. Mac
#
# ============================================================================
# SCOPE, STATED PLAINLY: this workflow does NOT rebuild the installer from
# source. It expects TWO ALREADY-BUILT, ALREADY-SIGNED installer files to
# exist in the repo's dist/ folder:
#
#   dist/Nutricula-32bit-SC.exe  (from "2. Windows - 32bit (for Mac/Linux)",
#                                 then NutriculaSignInstaller)
#   dist/Nutricula-64bit-SC.exe  (from "3. Windows - 64bit (for Mac/Linux)",
#                                 then NutriculaSignInstaller)
#
# ("SC" = self-contained: these two carry their own .NET runtime, which the
# MetaTrader 5 copy of Wine on a Mac cannot provide. The plain
# dist/Nutricula-32bit.exe is the Windows installer - it is NOT used here.)
#
# and only wraps them for Mac double-click launch. BOTH are bundled into the
# .app (stored inside it as Resources/Nutricula-32bit.exe and
# Resources/Nutricula-64bit.exe, the names the launcher script expects): the
# launcher tries the 64-bit one first and, only if the Wine it found cannot
# start that, the 32-bit one - invisibly to the person double-clicking (see
# mac-wrapper/Contents/MacOS/Nutricula).
#
# Why: the real Windows build involves KeyBaker.exe baking real private keys
# (from Keys/*.pem, deliberately kept empty in the repo and only filled in
# temporarily on a secure local machine - see Keys/*.pem's own comments) and
# VMProtect obfuscation. Piping those real secrets through GitHub Actions
# secrets would work technically, but it is a real security decision - it
# changes where your most sensitive key material can be touched/exposed, and
# that call is yours to make deliberately, not something to end up doing
# as a side effect of a convenience workflow. So this workflow starts from
# whatever .exe files you already produced your own, trusted way, and only
# adds the NEW part: wrapping them for Mac double-click launch.
#
# The output is a single file, "Nutricula.dmg", containing "Nutricula.app".
#
# This workflow is independent of the Windows workflows and of
# "5. Linux" - each has its own "Run workflow" button on the Actions tab, so
# you can build just this one platform whenever you want, without touching
# the others. A tag push (v*) triggers the Mac and Linux builds, each
# attaching its own file to the same GitHub Release separately.
# ============================================================================

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    # GitHub Actions does not allow the `secrets` context inside an `if:`
    # condition at all (only inside `env:`/`with:` blocks) - trying to
    # reference secrets.X directly in a step's `if:` fails the whole
    # workflow at parse time with "Unrecognized named-value: 'secrets'",
    # before a single step even runs. So the presence of each optional
    # Apple secret is captured here, at the job level, into a plain env
    # var (env IS a valid place to read secrets), and the `if:` conditions
    # below check those env vars instead.
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Verify both pre-built self-contained installers are present
        run: |
          for f in "dist/Nutricula-32bit-SC.exe" "dist/Nutricula-64bit-SC.exe"; do
            if [ ! -f "$f" ]; then
              echo "::error::'$f' is missing. Build both self-contained installers (workflows '2. Windows - 32bit (for Mac/Linux)' and '3. Windows - 64bit (for Mac/Linux)', then NutriculaSignInstaller), and place both signed files in dist/ under exactly these names."
              exit 1
            fi
          done

      - name: Verify each installer really has the architecture its name says
        run: |
          # Guards against the two files being swapped or mis-named when they
          # were placed into dist/ by hand: reads the PE header's Machine
          # field of each file. 32bit must be x86 (0x014C), 64bit must be
          # x64 (0x8664).
          python3 - <<'PY'
          import struct, sys
          expected = {
              "dist/Nutricula-32bit-SC.exe": (0x014C, "32-bit (x86)"),
              "dist/Nutricula-64bit-SC.exe": (0x8664, "64-bit (x64)"),
          }
          bad = False
          for path, (want, label) in expected.items():
              with open(path, "rb") as fh:
                  head = fh.read(4096)
              if head[:2] != b"MZ":
                  print("::error::%s is not a Windows executable." % path); bad = True; continue
              pe = struct.unpack_from("<I", head, 0x3C)[0]
              if pe + 6 > len(head) or head[pe:pe+4] != b"PE\0\0":
                  print("::error::%s has no valid PE header." % path); bad = True; continue
              machine = struct.unpack_from("<H", head, pe + 4)[0]
              if machine != want:
                  print("::error::%s should be %s (Machine 0x%04X) but is 0x%04X - wrong file or wrong name." % (path, label, want, machine)); bad = True
              else:
                  print("OK: %s is %s." % (path, label))
          sys.exit(1 if bad else 0)
          PY

      - name: Assemble the .app bundle
        run: |
          set -e
          APP="build/Nutricula.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "mac-wrapper/Contents/Info.plist" "$APP/Contents/Info.plist"
          # The launcher's file name MUST equal CFBundleExecutable in Info.plist.
          cp -R "mac-wrapper/Contents/MacOS/Nutricula" "$APP/Contents/MacOS/Nutricula"
          chmod +x "$APP/Contents/MacOS/Nutricula"
          # Stored under the names the launcher script looks for.
          cp "dist/Nutricula-32bit-SC.exe" "$APP/Contents/Resources/Nutricula-32bit.exe"
          cp "dist/Nutricula-64bit-SC.exe" "$APP/Contents/Resources/Nutricula-64bit.exe"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # ---- Signing + notarization: SKIPPED gracefully if the Apple
      # secrets below are not configured yet, so the unsigned .app still
      # builds and uploads for local testing while you decide whether to
      # buy the $99/year Apple Developer Program membership. Once you have
      # it, add these repo secrets (Settings -> Secrets and variables ->
      # Actions) to turn signing on:
      #   MACOS_CERTIFICATE_P12_BASE64 - your Developer ID Application
      #     certificate, exported as a .p12, base64-encoded (base64 -i
      #     cert.p12 | pbcopy on your own Mac, paste the result as the
      #     secret value).
      #   MACOS_CERTIFICATE_PASSWORD - the password you set when exporting
      #     that .p12.
      #   APPLE_ID - the Apple ID email on the Developer Program account.
      #   APPLE_TEAM_ID - your 10-character Team ID (developer.apple.com
      #     -> Membership).
      #   APPLE_APP_SPECIFIC_PASSWORD - an app-specific password for that
      #     Apple ID (appleid.apple.com -> Sign-In and Security ->
      #     App-Specific Passwords), used by notarytool instead of your
      #     real account password.
      - name: Import signing certificate
        id: import_cert
        if: env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm -f cert.p12
          echo "did_import=true" >> "$GITHUB_OUTPUT"

      - name: Code-sign the .app
        if: steps.import_cert.outputs.did_import == 'true'
        run: |
          set -e
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -n1 | sed -E 's/.*"(.+)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        if: steps.import_cert.outputs.did_import == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -e
          ditto -c -k --keepParent "$APP_PATH" "build/Nutricula-for-notarize.zip"
          xcrun notarytool submit "build/Nutricula-for-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_PATH"
          rm -f "build/Nutricula-for-notarize.zip"

      # A plain .dmg instead of a .zip: double-clicking it mounts a disk
      # image with the .app sitting right there, ready to double-click and
      # run immediately - no separate "extract" step first, unlike a .zip.
      # This is the simple/no-frills kind of .dmg: just the .app, no
      # Applications-folder shortcut icon or custom background image (that
      # fancier layout needs Finder window-position scripting, which is
      # known to be flaky on headless CI runners like this one - not worth
      # the risk for what's otherwise a cosmetic nicety).
      - name: Create the .dmg for distribution
        run: |
          set -e
          rm -f "build/Nutricula.dmg"
          hdiutil create \
            -volname "Nutricula" \
            -srcfolder "$APP_PATH" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "build/Nutricula.dmg"

      - name: Upload Mac build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nutricula
          path: build/Nutricula.dmg

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/Nutricula.dmg
