name: Build Nutricula Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Release EXE
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate VendorPublicKeyEmbedded.cs from the vendor public key
        shell: pwsh
        run: |
          # NutriculaInstaller.csproj compiles VendorPublicKeyEmbedded.cs
          # (consumed by SelfIntegrityCheck.cs, the Installer's own
          # anti-tamper check) but that file is never committed - it is
          # regenerated fresh on every build, right here, from ONLY
          # Keys/VendorSigningKey_Public.pem.
          #
          # That file is a PUBLIC key, not a secret, and is already
          # committed for real in this repo. This step reads nothing else
          # from Keys/ - none of the 3 real private keys or the transport
          # key are touched, read, or needed here. No GitHub Secret is
          # required and no private key material is ever involved in this
          # workflow. KeyBaker.exe / KeyBaker.cpp and the *_Generated.h
          # headers it produces (which DO need the private keys) are
          # completely separate from this step and are left untouched.
          #
          # SelfIntegrityCheck.cs hard-codes BCRYPT_ECDSA_PUBLIC_P256_MAGIC
          # and expects 32-byte X/Y - i.e. the vendor key MUST be a genuine
          # P-256 (secp256r1/prime256v1) key. This step fails the build
          # loudly if it is not, instead of silently baking in garbage
          # coordinates that would only surface as a self-integrity
          # failure at runtime on a customer's machine.
          $pemPath = "Full Source (Except Installer)\Keys\VendorSigningKey_Public.pem"
          if (-not (Test-Path -LiteralPath $pemPath -PathType Leaf)) {
            Write-Error "Vendor public key not found at $pemPath"
            exit 1
          }
          $pem = Get-Content -Raw -LiteralPath $pemPath
          if ($pem -notmatch 'BEGIN PUBLIC KEY') {
            Write-Error "$pemPath does not look like a PEM public key (no BEGIN PUBLIC KEY marker)."
            exit 1
          }

          $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $ecdsa.ImportFromPem($pem)
          } catch {
            Write-Error "Failed to parse $pemPath as an EC public key: $_"
            exit 1
          }

          $parameters = $ecdsa.ExportParameters($false)
          $curveOid = $parameters.Curve.Oid.Value
          if ($curveOid -ne "1.2.840.10045.3.1.7") {
            Write-Error "Vendor public key at $pemPath is not on curve P-256 (nistP256/prime256v1) - found OID $curveOid. SelfIntegrityCheck.cs only supports P-256; replace the key with a genuine P-256 key pair before building."
            exit 1
          }

          $x = $parameters.Q.X
          $y = $parameters.Q.Y
          if ($x.Length -ne 32 -or $y.Length -ne 32) {
            Write-Error "Unexpected coordinate size for vendor public key: X=$($x.Length) bytes, Y=$($y.Length) bytes (expected 32/32 for P-256)."
            exit 1
          }

          $xCsv = ($x | ForEach-Object { [int]$_ }) -join ","
          $yCsv = ($y | ForEach-Object { [int]$_ }) -join ","

          $outPath = "VendorPublicKeyEmbedded.cs"
          $content = @"
// AUTO-GENERATED at build time by .github/workflows/build.yml from VendorSigningKey_Public.pem - do not edit by hand or commit.
// Regenerated on every build; rotate the vendor key pair by replacing Keys\VendorSigningKey_Public.pem.
namespace NutriculaInstaller
{
    internal static class VendorPublicKeyEmbedded
    {
        public static readonly byte[] X = { $xCsv };
        public static readonly byte[] Y = { $yCsv };
    }
}
"@
          Set-Content -LiteralPath $outPath -Value $content -NoNewline -Encoding utf8
          Write-Host "Generated $outPath from $pemPath (P-256, verified 32/32-byte X/Y)."

      - name: Verify required installer files
        shell: pwsh
        run: |
          # CRITICAL FIX (found via full repo audit + build test): this list
          # was completely stale - it checked for Nutricula.ex4.sig,
          # Nutricula.ex5.sig, and MathUtils.dll, none of which
          # InstallerService.cs has needed since the Coordinator
          # architecture migration. It also never checked for any of the
          # actual files InstallerService.cs DOES need now (the license
          # DLLs, MachineId DLLs, Service/Broker exes, manifest.txt) - so
          # this check could never catch a genuinely missing required file,
          # while unnecessarily blocking a build over files nobody needs
          # anymore. List below matches InstallerService.cs's ResourceItem
          # declarations exactly - keep both in sync if that ever changes.
          $required = @(
            "icon.ico",
            "UIAssets\\installerpic.jpg",
            "Assets\\Nutricula.ex4",
            "Assets\\Nutricula.ex5",
            "Assets\\NutriculaLicenseCheck32.dll",
            "Assets\\NutriculaLicenseCheck64.dll",
            "Assets\\MachineId32.dll",
            "Assets\\MachineId64.dll",
            "Assets\\NutriculaLicenseService32.exe",
            "Assets\\NutriculaLicenseService64.exe",
            "Assets\\NutriculaLicenseBroker32.exe",
            "Assets\\NutriculaLicenseBroker64.exe",
            "Assets\\manifest.txt"
          )

          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              $missing += $file
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Required files are missing:`n" + ($missing -join "`n"))
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify project target framework
        shell: pwsh
        run: |
          $project = Get-Content -Raw -LiteralPath "NutriculaInstaller.csproj"
          if ($project -notmatch '<TargetFrameworkVersion>v4\.8</TargetFrameworkVersion>') {
            Write-Error "NutriculaInstaller.csproj is not targeting .NET Framework 4.8."
            exit 1
          }
          Write-Host "Project targets .NET Framework 4.8."

      - name: Rebuild Release
        shell: pwsh
        run: >-
          msbuild .\NutriculaInstaller.csproj
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=x86
          /p:BaseOutputPath=bin\
          /p:OutputPath=bin\Release\
          /m
          /v:minimal

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "bin\\Release\\NutriculaExpertInstaller.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "Build completed but NutriculaExpertInstaller.exe was not found."
            exit 1
          }

          Write-Host "Built EXE: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe | Format-List

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriculaExpertInstaller
          path: bin/Release/NutriculaExpertInstaller.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
