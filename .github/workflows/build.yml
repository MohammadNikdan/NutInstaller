name: Build Nutricula Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Release EXE
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify required installer files
        shell: pwsh
        run: |
          # CRITICAL FIX (found via full repo audit + build test): this list
          # was completely stale - it checked for Nutricula.ex4.sig,
          # Nutricula.ex5.sig, and MathUtils.dll, none of which
          # InstallerService.cs has needed since the Coordinator
          # architecture migration. It also never checked for any of the
          # actual files InstallerService.cs DOES need now (the license
          # DLLs, MachineId DLLs, Service/Broker exes, manifest.txt) - so
          # this check could never catch a genuinely missing required file,
          # while unnecessarily blocking a build over files nobody needs
          # anymore. List below matches InstallerService.cs's ResourceItem
          # declarations exactly - keep both in sync if that ever changes.
          $required = @(
            "icon.ico",
            "UIAssets\\installerpic.jpg",
            "Assets\\Nutricula.ex4",
            "Assets\\Nutricula.ex5",
            "Assets\\NutriculaLicenseCheck32.dll",
            "Assets\\NutriculaLicenseCheck64.dll",
            "Assets\\MachineId32.dll",
            "Assets\\MachineId64.dll",
            "Assets\\NutriculaLicenseService32.exe",
            "Assets\\NutriculaLicenseService64.exe",
            "Assets\\NutriculaLicenseBroker32.exe",
            "Assets\\NutriculaLicenseBroker64.exe",
            "Assets\\manifest.txt"
          )

          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              $missing += $file
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Required files are missing:`n" + ($missing -join "`n"))
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify project target framework
        shell: pwsh
        run: |
          $project = Get-Content -Raw -LiteralPath "NutriculaInstaller.csproj"
          if ($project -notmatch '<TargetFrameworkVersion>v4\.8</TargetFrameworkVersion>') {
            Write-Error "NutriculaInstaller.csproj is not targeting .NET Framework 4.8."
            exit 1
          }
          Write-Host "Project targets .NET Framework 4.8."

      - name: Rebuild Release
        shell: pwsh
        run: >-
          msbuild .\NutriculaInstaller.csproj
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=x86
          /p:BaseOutputPath=bin\
          /p:OutputPath=bin\Release\
          /m
          /v:minimal

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "bin\\Release\\NutriculaExpertInstaller.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "Build completed but NutriculaExpertInstaller.exe was not found."
            exit 1
          }

          Write-Host "Built EXE: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe | Format-List

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriculaExpertInstaller
          path: bin/Release/NutriculaExpertInstaller.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
